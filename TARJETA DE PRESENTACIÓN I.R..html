:root{
  color-scheme:light;
  --oliva:#9a9a5b; --vino:#5e1a2b; --rosa:#e07c97; --rosa-suave:#edc4c4; --crema:#fff8f6; --piel:#f3bda0;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100%;background:var(--rosa-suave);color:var(--vino);font-family:"Aroma Baked",Georgia,serif;
  display:flex;justify-content:center;align-items:flex-start;overflow-x:hidden;position:relative}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--rosa-suave);z-index:10}
#petalos{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.petalo{position:absolute;bottom:-60px;opacity:.55;animation:subir linear infinite}
@keyframes subir{
  0%{transform:translate3d(0,0,0) rotate(0)}
  50%{transform:translate3d(28px,-55vh,0) rotate(160deg)}
  100%{transform:translate3d(-12px,-115vh,0) rotate(340deg)}}

.tarjeta{position:relative;z-index:1;width:100%;max-width:430px;min-height:100vh;background:var(--crema);
  display:flex;flex-direction:column;align-items:center;overflow:hidden;animation:entrar .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes entrar{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@media(min-width:520px){
  body{padding:32px 0}
  .tarjeta{min-height:0;border-radius:36px;box-shadow:0 24px 60px -20px rgba(94,26,43,.35)}}

/* cabecera */
.cabecera{position:relative;width:100%;background:var(--rosa-suave);padding:34px 24px 96px;display:flex;justify-content:center}
.ola{position:absolute;left:0;bottom:-1px;width:100%;height:56px;overflow:hidden;line-height:0}
.ola svg{width:200%;height:100%;animation:ola 9s linear infinite}
.ola svg+svg{position:absolute;left:0;top:0;opacity:.6;animation-duration:14s;animation-direction:reverse}
@keyframes ola{to{transform:translateX(-50%)}}

/* logo (espacio para el logo de la marca) */
.logo{position:relative;display:flex;flex-direction:column;align-items:center;min-height:90px;justify-content:center}
.logo img{max-width:220px;max-height:110px;display:block}
.marca{font-family:"Velenor",Georgia,serif;font-size:84px;line-height:.9;letter-spacing:-.01em;position:relative;margin:0}
.marca .b{color:var(--oliva)} .marca .ea{color:var(--vino)}
.marca .flor{position:absolute;width:44px;height:44px;left:-18px;top:6px;animation:girar 16s linear infinite}
@keyframes girar{to{transform:rotate(360deg)}}
.sub{font-size:13px;color:var(--rosa);margin:6px 0 0;letter-spacing:.04em}

/* foto */
.foto{position:relative;z-index:2;margin-top:-84px;width:164px;height:164px;cursor:pointer;
  border-radius:58% 42% 55% 45% / 50% 55% 45% 50%;border:6px solid var(--crema);background:var(--rosa-suave);
  box-shadow:0 0 0 3px var(--rosa),0 14px 30px -12px rgba(94,26,43,.45);overflow:hidden;display:grid;place-items:center;
  animation:morph 10s ease-in-out infinite}
@keyframes morph{50%{border-radius:45% 55% 42% 58% / 55% 45% 55% 45%}}
.foto img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none}
.foto.con img{display:block}
.foto .vacio{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:14px;color:var(--vino);text-align:center}
.foto.con .vacio{display:none}
.foto input{position:absolute;inset:0;opacity:0;cursor:pointer}
.foto:focus-within{outline:3px solid var(--vino);outline-offset:4px}

/* nombre */
h1{font-size:38px;font-weight:400;margin:22px 20px 0;text-align:center;line-height:1.05;color:var(--vino)}
.rol{margin:8px 20px 0;font-size:17px;text-align:center;display:flex;align-items:center;gap:8px;color:var(--vino)}
.rol svg{width:18px;height:18px;animation:latido 2.4s ease-in-out infinite}
@keyframes latido{0%,60%,100%{transform:scale(1)}70%{transform:scale(1.25)}80%{transform:scale(1)}90%{transform:scale(1.18)}}

/* botones */
.contacto{width:100%;padding:34px 26px 18px;display:flex;flex-direction:column;gap:16px}
.btn{display:flex;align-items:center;gap:16px;text-decoration:none;border-radius:999px;padding:14px 22px 14px 16px;
  transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s,background .25s}
.btn:hover{transform:translateY(-3px) scale(1.015)}
.btn:active{transform:scale(.98)}
.btn:focus-visible{outline:3px solid var(--oliva);outline-offset:3px}
.btn .ico{flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center}
.btn .ico svg{width:24px;height:24px}
.btn b{display:block;font-weight:400;font-size:21px;line-height:1.1}
.btn small{display:block;font-size:14px;margin-top:3px;opacity:.9;overflow-wrap:anywhere}
.wa{background:var(--vino);color:var(--crema);box-shadow:0 12px 24px -12px rgba(94,26,43,.7)}
.wa .ico{background:var(--crema);color:var(--vino)}
.wa:hover{box-shadow:0 18px 30px -12px rgba(94,26,43,.75)}
.mail{background:var(--rosa-suave);color:var(--vino);box-shadow:inset 0 0 0 2px var(--rosa)}
.mail .ico{background:var(--rosa);color:var(--crema)}
.mail:hover{background:#f4d2d2}

.pie{margin:auto 0 0;padding:14px 0 30px;display:flex;gap:10px;align-items:center;font-size:13px;color:var(--oliva)}
.pie svg{width:20px;height:20px}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  #petalos{display:none}}
</style>
</head>

document.getElementById("nombre").textContent = CONFIG.nombre;
const wa = document.getElementById("wa");
wa.href = "https://wa.me/" + CONFIG.telefono.replace(/\D/g, "") + "?text=" + encodeURIComponent(CONFIG.mensaje);
document.getElementById("wa-txt").textContent = CONFIG.telefonoVisible;
const mail = document.getElementById("mail");
mail.href = "mailto:" + CONFIG.correo + "?subject=" + encodeURIComponent(CONFIG.asunto);
document.getElementById("mail-txt").textContent = CONFIG.correo;

const foto = document.getElementById("foto"), img = foto.querySelector("img");
function ponerFoto(src){ img.src = src; foto.classList.add("con"); }
if (CONFIG.foto) ponerFoto(CONFIG.foto);
foto.querySelector("input").addEventListener("change", e => {
  const f = e.target.files[0]; if (f) ponerFoto(URL.createObjectURL(f));
});

if (CONFIG.logo) {
  const l = document.getElementById("logo");
  l.innerHTML = '<img alt="Logo de la marca" src="' + CONFIG.logo.replace(/"/g, "") + '">';
}

// flores que flotan de fondo
const cont = document.getElementById("petalos");
for (let i = 0; i < 12; i++) {
  const s = 18 + Math.random() * 28;
  const el = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  el.setAttribute("class", "petalo");
  el.setAttribute("width", s); el.setAttribute("height", s);
  el.style.left = (Math.random() * 100) + "%";
  el.style.animationDuration = (16 + Math.random() * 16) + "s";
  el.style.animationDelay = (-Math.random() * 30) + "s";
  el.innerHTML = '<use href="#flor"/>';
  cont.appendChild(el);
}
</script>
